<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Bonne Année 2026 - Compte à Rebours Festif</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(-45deg, #000, #ff006e, #8338ec, #3a86ff, #06ffa5);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #fff;
            font-family: 'Arial Black', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Particules de confettis */
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }

        /* Compte à rebours principal */
        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(4em, 15vw, 12em);
            text-shadow: 0 0 30px #ffd700, 0 0 60px #ff006e;
            z-index: 10;
            text-align: center;
        }

        /* Titre Bonne Année */
        #newyear {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(2em, 8vw, 5em);
            opacity: 0;
            animation: fadeInUp 1s ease 5s forwards;
            text-shadow: 0 0 20px #fff;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translate(-50%, -30%);
            }
        }

        /* Souhaits */
        .wishes {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 1.5em;
            opacity: 0;
            animation: fadeIn 1s ease 7s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Boutons de contrôle */
        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 20;
        }

        button {
            background: rgba(255,255,255,0.2);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #ffd700;
            color: #000;
            transform: scale(1.1);
        }

        /* Feux d'artifice */
        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            pointer-events: none;
        }

        .firework::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(20); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Contrôles -->
    <div class="controls">
        <button onclick="startCountdown()">🔄 Recommencer</button>
        <button onclick="toggleMusic()">🎵 Musique</button>
    </div>

    <!-- Titre -->
    <h1 id="newyear">🎉 BONNE ANNÉE 2026 🎉</h1>

    <!-- Compte à rebours -->
    <div id="countdown">Prêt ?</div>

    <!-- Souhaits -->
    <div class="wishes">
        <p>🍾 Santé, Amour, Prospérité 🍾</p>
        <p>🌟 Succès et Bonheur 🌟</p>
        <p>✨ Toute l'année 2026 ✨</p>
    </div>

    <!-- Audio -->
    <audio id="music" loop preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.wav" type="audio/wav">
        <!-- Remplace par une vraie musique festive -->
    </audio>

    <script>
        let countdown = [4, 3, 2, 1, "BONNE ANNÉE !"];
        let i = 0;
        let interval;
        let musicPlaying = false;
        let particles = [];
        let fireworks = [];

        const el = document.getElementById('countdown');
        const music = document.getElementById('music');

        // Générateur de particules
        function createParticles() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    particle.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(particle);

                    setTimeout(() => particle.remove(), 5000);
                }, i * 20);
            }
        }

        // Feux d'artifice
        function createFirework(x, y) {
            const firework = document.createElement('div');
            firework.className = 'firework';
            firework.style.left = x + 'px';
            firework.style.top = y + 'px';
            document.body.appendChild(firework);

            setTimeout(() => firework.remove(), 1000);
        }

        // Compte à rebours
        function startCountdown() {
            i = 0;
            el.textContent = 'Prêt ?';
            el.style.transform = 'translate(-50%, -50%) scale(1)';
            
            clearInterval(interval);
            
            interval = setInterval(() => {
                if (i < countdown.length) {
                    el.textContent = countdown[i];
                    el.style.transform = `translate(-50%, -50%) scale(${1 + i * 0.3})`;
                    el.style.textShadow = `0 0 ${30 + i * 10}px #ffd700, 0 0 ${60 + i * 20}px #ff006e`;
                    
                    // Effets spéciaux
                    if (i >= 3) createParticles();
                    if (i === 4) launchFireworks();
                    
                    i++;
                } else {
                    clearInterval(interval);
                    celebrate();
                }
            }, 1000);
        }

        // Célébration finale
        function celebrate() {
            document.getElementById('newyear').style.animation = 'none';
            document.getElementById('newyear').style.animation = 'fadeInUp 1s ease forwards';
            
            // Musique
            music.play().catch(e => console.log('Audio bloqué'));
            musicPlaying = true;
            
            // Feux d'artifice continus
            setInterval(() => {
                createFirework(Math.random() * window.innerWidth, Math.random() * window.innerHeight / 2);
            }, 300);
            
            // Particules continues
            setInterval(createParticles, 2000);
        }

        // Contrôles
        function toggleMusic() {
            if (musicPlaying) {
                music.pause();
                musicPlaying = false;
            } else {
                music.play();
                musicPlaying = true;
            }
        }

        // Lancement automatique
        window.onload = startCountdown;

        // Sons d'ambiance (optionnel)
        function playSound(frequency, duration) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }
    </script>
</body>
</html>
